<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMAZON — Luxury Tech & Apparel</title>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            emailjs.init({
                publicKey: "B0GTqxt9aIu4L5ofj"
            });
        })();
    </script>

    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: rgba(23, 32, 54, 0.6);
            --bg-modal: #131b2e;
            --accent-cyan: #38bdf8;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255,255,255,0.1);
            --radius-lg: 16px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56,189,248,0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(251,191,36,0.05) 0%, transparent 40%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            background: rgba(11,15,25,0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
        }

        .brand span {
            color: var(--accent-cyan);
        }

        .search-bar {
            position: relative;
            width: 35%;
            max-width: 400px;
        }

        .search-bar input {
            width: 100%;
            padding: 0.6rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--accent-cyan);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.3rem;
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -10px;
            background: var(--accent-gold);
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: #0b0f19;
            font-weight: 700;
            padding: 0.6rem 1.4rem;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(56,189,248,0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .btn-secondary:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        main {
            flex: 1;
            padding: 3rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .hero {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
            background: linear-gradient(180deg,#fff 0%,#94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 0.5rem 1.2rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .category-tab.active,
        .category-tab:hover {
            background: var(--accent-cyan);
            color: #0b0f19;
            font-weight: 600;
            border-color: var(--accent-cyan);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(56,189,248,0.4);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        .image-wrapper {
            width: 100%;
            height: 220px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .product-card:hover img {
            transform: scale(1.08);
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            gap: 0.5rem;
        }

        .card-actions button {
            flex: 1;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: var(--bg-modal);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        /* Cart Slide-out Drawer */
        .cart-drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .cart-drawer-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--bg-modal);
            border-left: 1px solid var(--border-color);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease-in-out;
            padding: 2rem;
        }

        .cart-drawer-overlay.active .cart-drawer {
            right: 0;
        }

        .cart-items-container {
            flex: 1;
            overflow-y: auto;
            margin: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-cyan);
        }

        .otp-wrapper {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .otp-input {
            width: 45px;
            height: 55px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--accent-cyan);
            outline: none;
        }

        .otp-input:focus {
            border-color: var(--accent-cyan);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width:700px) {
            header {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .search-bar {
                order: 3;
                width: 100%;
                max-width: none;
            }

            .hero h1 {
                font-size: 2.3rem;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="#" class="brand">OMAZON<span>.</span></a>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search products..." oninput="filterProducts()">
    </div>

    <div class="nav-actions">
        <div class="cart-icon" onclick="openCartDrawer()">
            🛒
            <span class="cart-badge" id="cart-count">0</span>
        </div>

        <button class="btn-primary" id="open-auth-btn" onclick="openAuthModal()">Sign In</button>

        <div id="user-profile" class="hidden">
            <span id="user-email-display" style="color:var(--accent-cyan);font-size:0.9rem;margin-right:10px;"></span>
            <button class="btn-secondary" onclick="logout()">Logout</button>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <h1>Next-Gen Store</h1>
        <p>High-performance devices and luxury gear delivered instantly.</p>
    </section>

    <div class="categories">
        <button class="category-tab active" onclick="selectCategory('all',this)">All Items</button>
        <button class="category-tab" onclick="selectCategory('audio',this)">Audio</button>
        <button class="category-tab" onclick="selectCategory('wearables',this)">Wearables</button>
        <button class="category-tab" onclick="selectCategory('computing',this)">Computing</button>
        <button class="category-tab" onclick="selectCategory('gaming',this)">Gaming</button>
    </div>

    <section class="products-grid" id="products-container"></section>
</main>

<!-- CART DRAWER -->
<div class="cart-drawer-overlay" id="cart-drawer-overlay">
    <div class="cart-drawer">
        <button class="close-btn" onclick="closeCartDrawer()">&times;</button>
        <h2>Your Shopping Cart</h2>
        <div class="cart-items-container" id="cart-items-container">
            <p style="color:var(--text-muted);text-align:center;margin-top:2rem;">Your cart is empty.</p>
        </div>
        <div style="border-top:1px solid var(--border-color);padding-top:1rem;">
            <div style="display:flex;justify-content:space-between;margin-bottom:1rem;font-size:1.1rem;font-weight:700;">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="btn-primary" style="width:100%;" onclick="checkoutCart()">Proceed to Checkout</button>
        </div>
    </div>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="auth-modal">
    <div class="modal-card">
        <button class="close-btn" onclick="closeAuthModal()">&times;</button>

        <div id="step-email">
            <h2 style="margin-bottom:.5rem;">Sign In to Omazon</h2>
            <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem;">Receive a 6-digit passcode to log in instantly.</p>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email-input" class="input-field" placeholder="name@domain.com" autocomplete="email">
            </div>

            <button class="btn-primary" id="send-btn" style="width:100%;" onclick="sendOTP()">Send Passcode</button>
        </div>

        <div id="step-otp" class="hidden">
            <h2>Enter Passcode</h2>
            <p style="color:var(--text-muted);font-size:.9rem;margin-top:.4rem;">Check your inbox for the code.</p>

            <div class="otp-wrapper">
                <input class="otp-input" maxlength="1" inputmode="numeric" oninput="moveFocus(this,0)">
                <input class="otp-input" maxlength="1" inputmode="numeric" oninput="moveFocus(this,1)">
                <input class="otp-input" maxlength="1" inputmode="numeric" oninput="moveFocus(this,2)">
                <input class="otp-input" maxlength="1" inputmode="numeric" oninput="moveFocus(this,3)">
                <input class="otp-input" maxlength="1" inputmode="numeric" oninput="moveFocus(this,4)">
                <input class="otp-input" maxlength="1" inputmode="numeric" oninput="moveFocus(this,5)">
            </div>

            <button class="btn-primary" style="width:100%;" onclick="verifyOTP()">Verify & Log In</button>
        </div>
    </div>
</div>

<!-- QUICK VIEW -->
<div class="modal-overlay" id="quickview-modal">
    <div class="modal-card" style="max-width:600px;">
        <button class="close-btn" onclick="closeQuickView()">&times;</button>
        <div style="display:flex;gap:1.5rem;flex-wrap:wrap;">
            <img id="qv-img" src="" alt="" style="width:220px;height:220px;object-fit:cover;border-radius:var(--radius-sm);">
            <div style="flex:1;display:flex;flex-direction:column;justify-content:center;">
                <span id="qv-category" class="product-category"></span>
                <h2 id="qv-title" style="margin-bottom:.5rem;"></h2>
                <p id="qv-desc" style="color:var(--text-muted);font-size:.9rem;margin-bottom:1rem;"></p>
                <div id="qv-price" class="product-price"></div>
                <button class="btn-primary" onclick="addToCartFromQuickView()">Add to Cart</button>
            </div>
        </div>
    </div>
</div>

<script>
const products = [
    { id: 1, name: "Acoustics Pro ANC", category: "audio", price: 349, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&q=80", desc: "Studio-grade wireless headphones with active noise cancellation." },
    { id: 2, name: "Chronos Smart Watch", category: "wearables", price: 599, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80", desc: "Titanium casing with biometric sensors and Sapphire Glass." },
    { id: 3, name: "AuraBook Ultra 15", category: "computing", price: 1299, image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=600&q=80", desc: "Ultra-thin laptop with high-color accuracy display and fast computing." },
    { id: 4, name: "Visionary AR Glasses", category: "wearables", price: 899, image: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=600&q=80", desc: "Lightweight augmented reality glasses with spatial audio built-in." },
    { id: 5, name: "Pulse Wireless Earbuds", category: "audio", price: 199, image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=600&q=80", desc: "Compact earbuds featuring deep bass response and IPX7 waterproofing." },
    { id: 6, name: "Mechanical Cyber Keyboard", category: "computing", price: 249, image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600&q=80", desc: "Custom mechanical switches with customizable per-key RGB backlighting." },
    { id: 7, name: "Quantum Gaming Deck", category: "gaming", price: 1499, image: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=600&q=80", desc: "Extreme performance desktop rig built for high-refresh 4K gaming." },
    { id: 8, name: "Apex Pro Wireless Mouse", category: "gaming", price: 159, image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=600&q=80", desc: "Ultra-lightweight competitive gaming mouse with sub-millisecond latency." },
    { id: 9, name: "EchoStudio Smart Speaker", category: "audio", price: 229, image: "https://images.unsplash.com/photo-1543512214-318c7553f230?w=600&q=80", desc: "Room-filling directional audio with voice assistant integration." }
];

let cart = [];
let currentUserEmail = null;
let currentCategory = "all";
let activeQuickViewItem = null;
let generatedOTP = null;

function renderProducts(items) {
    const container = document.getElementById("products-container");
    container.innerHTML = items.map(p => `
        <div class="product-card">
            <div class="image-wrapper">
                <img src="${p.image}" alt="${p.name}">
            </div>
            <span class="product-category">${p.category}</span>
            <div class="product-title">${p.name}</div>
            <div class="product-price">$${p.price}.00</div>
            <div class="card-actions">
                <button class="btn-secondary" onclick="openQuickView(${p.id})">Quick View</button>
                <button class="btn-primary" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
        </div>
    `).join("");
}

function filterProducts() {
    const query = document.getElementById("search-input").value.toLowerCase().trim();
    const filtered = products.filter(p => 
        (currentCategory === "all" || p.category === currentCategory) &&
        p.name.toLowerCase().includes(query)
    );
    renderProducts(filtered);
}

function selectCategory(cat, el) {
    currentCategory = cat;
    document.querySelectorAll(".category-tab").forEach(tab => tab.classList.remove("active"));
    el.classList.add("active");
    filterProducts();
}

function openQuickView(id) {
    activeQuickViewItem = products.find(p => p.id === id);
    if (!activeQuickViewItem) return;

    document.getElementById("qv-img").src = activeQuickViewItem.image;
    document.getElementById("qv-title").innerText = activeQuickViewItem.name;
    document.getElementById("qv-category").innerText = activeQuickViewItem.category;
    document.getElementById("qv-desc").innerText = activeQuickViewItem.desc;
    document.getElementById("qv-price").innerText = `$${activeQuickViewItem.price}.00`;

    document.getElementById("quickview-modal").classList.add("active");
}

function closeQuickView() {
    document.getElementById("quickview-modal").classList.remove("active");
}

function addToCartFromQuickView() {
    if (activeQuickViewItem) {
        addToCart(activeQuickViewItem.id);
        if (currentUserEmail) {
            closeQuickView();
        }
    }
}

function addToCart(id) {
    if (!currentUserEmail) {
        openAuthModal();
        return;
    }

    const product = products.find(p => p.id === id);
    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.qty++;
    } else {
        cart.push({ ...product, qty: 1 });
    }

    updateCartUI();
    openCartDrawer();
}

function updateCartUI() {
    const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
    document.getElementById("cart-count").innerText = totalCount;

    const container = document.getElementById("cart-items-container");
    if (cart.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);text-align:center;margin-top:2rem;">Your cart is empty.</p>';
        document.getElementById("cart-total-price").innerText = "$0.00";
        return;
    }

    let totalPrice = 0;
    container.innerHTML = cart.map(item => {
        totalPrice += item.price * item.qty;
        return `
            <div class="cart-item-row">
                <div>
                    <div style="font-weight:700;font-size:0.95rem;">${item.name}</div>
                    <div style="color:var(--text-muted);font-size:0.85rem;">$${item.price} × ${item.qty}</div>
                </div>
                <button class="btn-secondary" style="padding:0.3rem 0.6rem;font-size:0.8rem;" onclick="removeFromCart(${item.id})">Remove</button>
            </div>
        `;
    }).join("");

    document.getElementById("cart-total-price").innerText = `$${totalPrice}.00`;
}

function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    updateCartUI();
}

function openCartDrawer() {
    document.getElementById("cart-drawer-overlay").classList.add("active");
}

function closeCartDrawer() {
    document.getElementById("cart-drawer-overlay").classList.remove("active");
}

function checkoutCart() {
    if (cart.length === 0) return;
    alert("Order placed successfully! Thank you for shopping with Omazon.");
    cart = [];
    updateCartUI();
    closeCartDrawer();
}

function openAuthModal() {
    document.getElementById("auth-modal").classList.add("active");
}

function closeAuthModal() {
    document.getElementById("auth-modal").classList.remove("active");
}

/* EMAILJS OTP */
async function sendOTP() {
    const email = document.getElementById("email-input").value.trim();
    if (!email || !email.includes("@")) {
        alert("Enter a valid email address.");
        return;
    }

    const btn = document.getElementById("send-btn");
    btn.disabled = true;
    btn.innerText = "Sending...";

    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

    const templateParams = {
        email: email,
        otp: generatedOTP
    };

    try {
        await emailjs.send("service_3qgw526", "template_ps055sv", templateParams);
        currentUserEmail = email;
        document.getElementById("step-email").classList.add("hidden");
        document.getElementById("step-otp").classList.remove("hidden");
        document.querySelector(".otp-input").focus();
    } catch (error) {
        console.error("EMAILJS ERROR:", error);
        generatedOTP = null;
        alert("Email failed to send. Please try again.");
    } finally {
        btn.disabled = false;
        btn.innerText = "Send Passcode";
    }
}

function moveFocus(el, idx) {
    el.value = el.value.replace(/[^0-9]/g,"");
    const inputs = document.querySelectorAll(".otp-input");
    if (el.value.length === 1 && idx < inputs.length - 1) {
        inputs[idx + 1].focus();
    }
}

function verifyOTP() {
    let enteredOTP = "";
    document.querySelectorAll(".otp-input").forEach(input => {
        enteredOTP += input.value;
    });

    if (enteredOTP.length !== 6) {
        alert("Enter the full 6-digit code.");
        return;
    }

    if (generatedOTP && enteredOTP === generatedOTP) {
        document.getElementById("open-auth-btn").classList.add("hidden");
        document.getElementById("user-profile").classList.remove("hidden");
        document.getElementById("user-email-display").innerText = currentUserEmail;
        closeAuthModal();
    } else {
        alert("Invalid OTP code. Try again.");
    }
}

function logout() {
    currentUserEmail = null;
    generatedOTP = null;
    cart = [];
    updateCartUI();

    document.getElementById("open-auth-btn").classList.remove("hidden");
    document.getElementById("user-profile").classList.add("hidden");
    document.getElementById("step-email").classList.remove("hidden");
    document.getElementById("step-otp").classList.add("hidden");
    document.querySelectorAll(".otp-input").forEach(input => { input.value = ""; });
    document.getElementById("email-input").value = "";
}

document.querySelectorAll(".modal-overlay").forEach(modal => {
    modal.addEventListener("click", event => {
        if (event.target === modal) {
            modal.classList.remove("active");
        }
    });
});

document.getElementById("cart-drawer-overlay").addEventListener("click", event => {
    if (event.target === document.getElementById("cart-drawer-overlay")) {
        closeCartDrawer();
    }
});

renderProducts(products);
</script>

</body>
</html>
