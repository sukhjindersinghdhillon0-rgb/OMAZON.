<script>

const products = [

    {
        id:1,
        name:"Acoustics Pro ANC",
        category:"audio",
        price:349,
        image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&q=80",
        desc:"Studio-grade wireless headphones with active noise cancellation."
    },

    {
        id:2,
        name:"Chronos Smart Watch",
        category:"wearables",
        price:599,
        image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80",
        desc:"Titanium casing with biometric sensors and Sapphire Glass."
    },

    {
        id:3,
        name:"AuraBook Ultra 15",
        category:"computing",
        price:1299,
        image:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=600&q=80",
        desc:"Ultra-thin laptop with high-color accuracy display and fast computing."
    },

    {
        id:4,
        name:"Visionary AR Glasses",
        category:"wearables",
        price:899,
        image:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=600&q=80",
        desc:"Lightweight augmented reality glasses with spatial audio built-in."
    },

    {
        id:5,
        name:"Pulse Wireless Earbuds",
        category:"audio",
        price:199,
        image:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=600&q=80",
        desc:"Compact earbuds featuring deep bass response and IPX7 waterproofing."
    },

    {
        id:6,
        name:"Mechanical Cyber Keyboard",
        category:"computing",
        price:249,
        image:"https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600&q=80",
        desc:"Custom mechanical switches with customizable per-key RGB backlighting."
    }

];

let cartCount = 0;
let currentUserEmail = null;
let currentCategory = "all";
let activeQuickViewItem = null;
let generatedOTP = null;

function renderProducts(items) {

    const container =
        document.getElementById("products-container");

    container.innerHTML = items.map(p => `

        <div class="product-card">

            <div class="image-wrapper">
                <img src="${p.image}" alt="${p.name}">
            </div>

            <span class="product-category">
                ${p.category}
            </span>

            <div class="product-title">
                ${p.name}
            </div>

            <div class="product-price">
                $${p.price}.00
            </div>

            <div class="card-actions">

                <button
                    class="btn-secondary"
                    onclick="openQuickView(${p.id})">
                    Quick View
                </button>

                <button
                    class="btn-primary"
                    onclick="addToCart()">
                    Add to Cart
                </button>

            </div>

        </div>

    `).join("");

}

function filterProducts() {

    const query =
        document
            .getElementById("search-input")
            .value
            .toLowerCase()
            .trim();

    const filtered =
        products.filter(p =>
            (currentCategory === "all" ||
             p.category === currentCategory) &&
            p.name.toLowerCase().includes(query)
        );

    renderProducts(filtered);
}

function selectCategory(cat, el) {

    currentCategory = cat;

    document
        .querySelectorAll(".category-tab")
        .forEach(tab =>
            tab.classList.remove("active")
        );

    el.classList.add("active");

    filterProducts();
}

function openQuickView(id) {

    activeQuickViewItem =
        products.find(p => p.id === id);

    if (!activeQuickViewItem) return;

    document.getElementById("qv-img").src =
        activeQuickViewItem.image;

    document.getElementById("qv-title").innerText =
        activeQuickViewItem.name;

    document.getElementById("qv-category").innerText =
        activeQuickViewItem.category;

    document.getElementById("qv-desc").innerText =
        activeQuickViewItem.desc;

    document.getElementById("qv-price").innerText =
        `$${activeQuickViewItem.price}.00`;

    document
        .getElementById("quickview-modal")
        .classList.add("active");
}

function closeQuickView() {

    document
        .getElementById("quickview-modal")
        .classList.remove("active");
}

function addToCartFromQuickView() {

    addToCart();

    if (currentUserEmail) {
        closeQuickView();
    }
}

function addToCart() {

    if (!currentUserEmail) {

        openAuthModal();

        showToast(
            "Please sign in to add items to cart.",
            "🔒"
        );

        return;
    }

    cartCount++;

    document.getElementById("cart-count").innerText =
        cartCount;

    showToast(
        "Item added to cart!",
        "🛒"
    );
}

function openAuthModal() {

    document
        .getElementById("auth-modal")
        .classList.add("active");
}

function closeAuthModal() {

    document
        .getElementById("auth-modal")
        .classList.remove("active");
}

function showToast(msg, icon = "⚡") {

    const toast =
        document.getElementById("toast-notification");

    document.getElementById("toast-msg").innerText =
        msg;

    document.getElementById("toast-icon").innerText =
        icon;

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    },3500);
}

/* EMAILJS OTP */

async function sendOTP() {

    const email =
        document
            .getElementById("email-input")
            .value
            .trim();

    if (!email || !email.includes("@")) {

        showToast(
            "Enter a valid email address.",
            "⚠️"
        );

        return;
    }

    const btn =
        document.getElementById("send-btn");

    btn.disabled = true;
    btn.innerText = "Sending...";

    generatedOTP =
        Math.floor(
            100000 +
            Math.random() * 900000
        ).toString();

    const templateParams = {
        email: email,
        otp: generatedOTP
    };

    try {

        const response =
            await emailjs.send(
                "service_3qgw526",
                "template_ps055sv",
                templateParams
            );

        console.log(
            "EMAILJS SUCCESS:",
            response.status,
            response.text
        );

        currentUserEmail = email;

        document
            .getElementById("step-email")
            .classList.add("hidden");

        document
            .getElementById("step-otp")
            .classList.remove("hidden");

        showToast(
            "OTP sent to your email!",
            "📧"
        );

        document
            .querySelector(".otp-input")
            .focus();

    } catch (error) {

        console.error(
            "EMAILJS ERROR:",
            error
        );

        generatedOTP = null;

        showToast(
            "Email failed: " +
            (error.text ||
             error.message ||
             error.status ||
             "Unknown error"),
            "❌"
        );

    } finally {

        btn.disabled = false;
        btn.innerText = "Send Passcode";

    }
}

function moveFocus(el, idx) {

    el.value =
        el.value.replace(/[^0-9]/g,"");

    const inputs =
        document.querySelectorAll(".otp-input");

    if (
        el.value.length === 1 &&
        idx < inputs.length - 1
    ) {
        inputs[idx + 1].focus();
    }
}

function verifyOTP() {

    let enteredOTP = "";

    document
        .querySelectorAll(".otp-input")
        .forEach(input => {
            enteredOTP += input.value;
        });

    if (enteredOTP.length !== 6) {

        showToast(
            "Enter the full 6-digit code.",
            "⚠️"
        );

        return;
    }

    if (
        generatedOTP &&
        enteredOTP === generatedOTP
    ) {

        document
            .getElementById("open-auth-btn")
            .classList.add("hidden");

        document
            .getElementById("user-profile")
            .classList.remove("hidden");

        document
            .getElementById("user-email-display")
            .innerText =
                currentUserEmail;

        closeAuthModal();

        showToast(
            "Signed in successfully!",
            "✅"
        );

    } else {

        showToast(
            "Invalid OTP code. Try again.",
            "❌"
        );

    }
}

function logout() {

    currentUserEmail = null;
    generatedOTP = null;

    document
        .getElementById("open-auth-btn")
        .classList.remove("hidden");

    document
        .getElementById("user-profile")
        .classList.add("hidden");

    document
        .getElementById("step-email")
        .classList.remove("hidden");

    document
        .getElementById("step-otp")
        .classList.add("hidden");

    document
        .querySelectorAll(".otp-input")
        .forEach(input => {
            input.value = "";
        });

    document.getElementById("email-input").value = "";

    showToast(
        "Logged out.",
        "ℹ️"
    );
}

/* Close modals by clicking outside */

document
    .querySelectorAll(".modal-overlay")
    .forEach(modal => {

        modal.addEventListener("click", event => {

            if (event.target === modal) {
                modal.classList.remove("active");
            }

        });

    });

/* Initial render */

renderProducts(products);

</script>

</body>
